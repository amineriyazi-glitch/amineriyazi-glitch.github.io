[3,"ebooks","خطة وجبات أسبوعية صحية","جداول وجبات وقوائم تسوق جاهزة للطباعة.",700,"PDF",["جداول وجبات لأربعة أسابيع","قوائم تسوق جاهزة","ملف PDF للطباعة"]],

refund:["سياسة الاسترجاع","<p>المنتجات الرقمية لا تُسترجع عادةً بعد تحميلها، لأن الملف يصبح بحوزتك.</p><p>نقبل طلب الاسترجاع في ثلاث حالات: الملف تالف أو لا يُفتح ولم نستطع إصلاحه، أو المنتج يختلف جوهرياً عن وصفه، أو شراء مكرر بالخطأ.</p><p>قدّم الطلب خلال ٧ أيام من الشراء (مدة مقترحة) عبر صفحة اتصل بنا مع اسم المنتج ورقم الطلب. عند القبول يُردّ المبلغ بوسيلة الدفع نفسها.</p><p>هذه صيغة أولية، وتلزم مراجعتها قانونياً قبل الإطلاق.</p>"],

const cover=(p,v=0,t="")=>{const k=p[1],h=HUE[k]+(p[0]+v)%3*12,id=`g${t}${p[0]}${v}`,ac=`hsl(${h} 85% 66%)`,md=`hsl(${h} 55% 40%)`;let a="";
 if(k==="ebooks")a=`<g transform="rotate(${-4*v} 160 120)"><rect x="100" y="28" width="120" height="176" rx="6" fill="${md}"/><rect x="100" y="28" width="12" height="176" rx="4" fill="#0007"/><rect x="124" y="50" width="76" height="7" rx="3" fill="#fff"/><rect x="124" y="65" width="54" height="7" rx="3" fill="#fff" opacity=".6"/><circle cx="162" cy="132" r="${22+v*7}" fill="${ac}"/><rect x="124" y="180" width="46" height="5" rx="2" fill="#fff" opacity=".5"/></g>`;
 else if(k==="templates")for(let i=0;i<9;i++){const c=(i+v)%3;a+=`<rect x="${70+i%3*64}" y="${24+(i/3|0)*64}" width="56" height="56" rx="8" fill="${c?c==1?md:"#fff2":ac}"/>`}
 else if(k==="plans")a=`<g fill="none" stroke="${ac}" stroke-width="3"><rect x="60" y="36" width="200" height="156"/><path d="M60 104H${140+v*24}M${140+v*24} 36V104M${140+v*24} 146H260M200 146V192M108 192V150"/></g><g fill="${ac}"><circle cx="100" cy="70" r="5"/><circle cx="222" cy="90" r="5"/></g>`;
 else if(k==="designs")for(let i=0;i<6;i++){const x=76+i%3*70,y=52+(i/3|0)*70,c=(i+v)%3;a+=c==0?`<circle cx="${x+25}" cy="${y+25}" r="25" fill="${ac}"/>`:c==1?`<rect x="${x}" y="${y}" width="50" height="50" rx="10" fill="${md}"/>`:`<path d="M${x+25} ${y}L${x+50} ${y+50}H${x}Z" fill="#fff" opacity=".85"/>`}
 else for(let i=0;i<2;i++)a+=`<rect x="${72+i*100}" y="${20+i*16}" width="76" height="164" rx="14" fill="hsl(${h+i*40+v*25} 70% 38%)" stroke="#fff4" stroke-width="3"/><circle cx="${110+i*100}" cy="${80+i*16}" r="${16+v*4}" fill="${ac}" opacity=".8"/><rect x="${84+i*100}" y="${130+i*16}" width="52" height="6" rx="3" fill="#fff" opacity=".6"/>`;
 return `<svg viewBox="0 0 320 240" role="img" aria-label="معاينة ${p[2]}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h} 60% 22%)"/><stop offset="1" stop-color="hsl(${h+30} 70% 8%)"/></linearGradient></defs><rect width="320" height="240" fill="url(#${id})"/>${a}<text x="12" y="228" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="13" fill="#fff" opacity=".85">${p[5]}</text><text x="308" y="228" text-anchor="end" font-family="Tajawal,sans-serif" font-size="11" fill="#fff" opacity=".6">معاينة توضيحية</text></svg>`};

function home(){return `<section class="hero"><h1>منتجات رقمية جاهزة بجودة تليق بمشروعك</h1><p>كتب PDF وقوالب ومخططات وتصاميم بأسعار بالدينار الجزائري.</p><button class="b" data-go="shop">تصفّح المتجر</button></section><div class="tiles">${Object.keys(CAT).map(k=>`<a class="tile" href="#c-${k}" data-go="c-${k}"><b>${CAT[k]}</b><small>${P.filter(p=>p[1]===k).length} منتجات</small></a>`).join("")}</div><h2>أحدث المنتجات</h2><div class="grid">${P.slice(-6).reverse().map(card).join("")}</div>`}
function shop(){const L=P.filter(p=>(cat==="all"||p[1]===cat)&&(p[2]+p[3]).toLowerCase().includes(q.trim()));return `<h1>${cat==="all"?"كل المنتجات":CAT[cat]||""}</h1><div class="chips">${["all",...Object.keys(CAT)].map(k=>`<button class="chip" aria-pressed="${k===cat}" data-go="${k==="all"?"shop":"c-"+k}">${k==="all"?"الكل":CAT[k]}</button>`).join("")}</div>${L.length?`<div class="grid">${L.map(card).join("")}</div>`:`<p class="mu">لا توجد نتائج لبحثك.</p>`}`}
function detail(p){const n=gal;return `<div class="det"><div><div class="main">${cover(p,n)}</div><div class="thumbs">${[0,1,2].map(i=>`<button class="tb" aria-pressed="${i===n}" data-img="${i}" aria-label="صورة ${i+1}">${cover(p,i,"t")}</button>`).join("")}</div></div><div><span class="tag">${CAT[p[1]]}</span><h1>${p[2]}</h1><p>${p[3]}</p><div class="price">${money(p[4])}</div>${btn(p)}<h2>ما الذي ستحصل عليه</h2><ul class="facts">${p[6].map(x=>`<li>${x}</li>`).join("")}</ul><dl class="spec"><dt>صيغة الملف</dt><dd>${p[5]}</dd><dt>القسم</dt><dd>${CAT[p[1]]}</dd><dt>التسليم</dt><dd>غير مفعّل في النسخة التجريبية</dd></dl><p><small>المعاينات توضيحية. <a href="#refund" data-go="refund">سياسة الاسترجاع</a></small></p></div></div><h2>منتجات مشابهة</h2><div class="grid">${P.filter(x=>x[1]===p[1]&&x!==p).map(card).join("")}</div>`}
const dz=n=>n.toLocaleString("ar-DZ")+" د.ج";
function cartv(){const L=cart.map(find),t=L.reduce((s,p)=>s+p[4],0);if(!L.length)return `<h1>السلة</h1><p class="mu">سلتك فارغة.</p><button class="b" data-go="shop">تصفّح المنتجات</button>`;return `<h1>السلة</h1>${L.map(p=>`<div class="li"><div class="th">${cover(p)}</div><div class="lt"><a href="#p-${p[0]}" data-go="p-${p[0]}">${p[2]}</a><small>${CAT[p[1]]} · ${p[5]}</small></div><b>${money(p[4])}</b><button class="g" data-rm="${p[0]}" aria-label="حذف ${p[2]}">حذف</button></div>`).join("")}<div class="sum"><div><span>عدد المنتجات</span><span>${L.length}</span></div><div><span>الشحن</span><span>لا يوجد (منتجات رقمية)</span></div><div class="fin"><span>المجموع النهائي (DZD)</span><b>${dz(t)}</b></div></div><div class="acts"><button class="b" data-co>إتمام الطلب</button><button class="g" data-clear>إفراغ السلة</button></div><p><small>راجع <a href="#refund" data-go="refund">سياسة الاسترجاع</a> قبل الشراء.</small></p>${co?`<div class="demo" role="alert">الدفع وتسليم الملفات غير مفعّلين بعد. يحتاج ذلك إلى ربط آمن بخدمة دفع مرخّصة وخادم يسلّم الملفات بعد تأكيد الدفع. لم يُرسل شيء ولم تُجمع أي بيانات.</div>`:""}`}
function bar(){const b=$("#bar"),t=cart.reduce((s,i)=>s+find(i)[4],0),on=cart.length&&view!=="cart";b.hidden=!on;if(on)b.innerHTML=`<span>${cart.length} في السلة · <b>${dz(t)}</b></span><button class="b" data-go="cart">عرض السلة</button>`;document.body.classList.toggle("hb",!!on)}
function render(){let h=view,c;
 if(h==="home")c=home();else if(h==="shop")c=shop();
 else if(h.startsWith("c-")&&CAT[h.slice(2)]){cat=h.slice(2);c=shop()}
 else if(h.startsWith("p-")&&find(h.slice(2)))c=detail(find(h.slice(2)));
 else if(h==="cart")c=cartv();else if(T[h])c=`<h1>${T[h][0]}</h1><div class="prose">${T[h][1]}</div>`;
 else{view="home";c=home()}
 $("#main").innerHTML=`<div class="demo">نسخة تجريبية: المنتجات توضيحية، والدفع وتسليم الملفات غير مفعّلين بعد.</div>`+c;
 $("#n").textContent=cart.length;bar();$("#cur").textContent=cur;
}
function nav(h){if(h==="shop")cat="all";co=false;gal=0;view=h;render();scrollTo(0,0);try{if(location.hash!=="#"+h)location.hash=h}catch(e){}}
$("#nv").innerHTML=`<button data-go="home">الرئيسية</button><button data-go="shop">كل المنتجات</button>`+Object.keys(CAT).map(k=>`<button data-go="c-${k}">${CAT[k]}</button>`).join("");
document.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-add],[data-rm],[data-co],[data-clear],[data-img]");if(!t)return;e.preventDefault();const d=t.dataset;
 if(d.go)nav(d.go);
 else if(d.add){if(!cart.includes(+d.add))cart.push(+d.add);save();render()}
 else if(d.rm){cart=cart.filter(i=>i!==+d.rm);save();render()}
 else if(d.img){gal=+d.img;render()}
 else if("clear" in d){cart=[];save();co=false;render()}
 else{co=true;render()}});
$("#cur").onclick=()=>{cur=cur==="DZD"?"USD":"DZD";render()};
$("#q").oninput=e=>{q=e.target.value.toLowerCase();view==="shop"||view.startsWith("c-")?render():nav("shop")};
onhashchange=()=>{const h=location.hash.slice(1);if(h&&h!==view)nav(h)};
nav(location.hash.slice(1)||"home");
</script>
</body>
</html>
